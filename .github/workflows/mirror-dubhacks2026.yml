name: Mirror main to dubhacks2026

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'elainel7/dubhacks26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to tiredwren/dubhacks2026
        env:
          MIRROR_KEY: ${{ secrets.MIRROR_KEY }}
        run: |
          if [ -z "$MIRROR_KEY" ]; then
            echo "MIRROR_KEY is not set, so this push stays on dubhacks26 only."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$MIRROR_KEY" > ~/.ssh/dubhacks2026
          chmod 600 ~/.ssh/dubhacks2026
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git remote add mirror git@github.com:tiredwren/dubhacks2026.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/dubhacks2026 -o IdentitiesOnly=yes" git push mirror HEAD:main
